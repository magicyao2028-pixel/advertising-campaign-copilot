[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "advertising-campaign-copilot"
version = "0.7.0"
description = "Offline, objective-aware campaign planning and optimization workflow."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "magicyao2028-pixel" }]
dependencies = []

[project.scripts]
campaign-copilot = "campaign_copilot.cli:main"
campaign-feedback-replay = "campaign_copilot.creative_feedback_cli:main"
campaign-trial = "campaign_copilot.trial_cli:main"

[tool.setuptools.packages.find]
where = ["src"]
